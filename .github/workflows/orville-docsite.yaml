name: Docsite

on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

defaults:
  run:
    shell: bash

jobs:
  docsite-build:
    name: Build the Docsite
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      contents: read
      actions: read

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache
        uses: actions/cache@v6
        env:
          cache-version: v3

        with:
          key: ${{ env.cache-version }}-docsite-${{ hashFiles( 'orville-docsite/**/stack.yaml', 'orville-docsite/**/*.cabal') }}
          restore-keys: |
            ${{ env.cache-version }}-docsite-
          path: |
            ./stack-root

      - name: Setup Stack
        uses: flipstone/github-actions/setup-dockerized-stack@3dac943f10ac962138e25ccceaf6aba4d18396ee # v2026.8.28.2
        with:
          stack-root: ../stack-root
          working-directory: orville-docsite

      - name: Run Tests
        working-directory: orville-docsite
        env:
          # The getting-started sample runs `stack new`, which fetches its
          # template through the GitHub REST API. Hosted runners share IPs, so
          # the 60/hour unauthenticated limit is easily exhausted; stack sends
          # GITHUB_TOKEN as Basic auth when it is set. compose.yaml passes the
          # variable into the dev container.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/build
