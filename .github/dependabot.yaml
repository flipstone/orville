version: 2

# haskell-tools is pinned in three Dockerfiles (docker ecosystem) and two
# compose files (docker-compose ecosystem). A per-ecosystem group would still
# open two PRs per release; a multi-ecosystem group folds all five references
# into one PR. The schedule lives on the group; members inherit it.
multi-ecosystem-groups:
  haskell-tools:
    schedule:
      interval: "weekly"

updates:
  # One PR for all action bumps rather than one PR per action.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  # The haskell-tools base in each sub-project's Dockerfile. Directories are
  # listed explicitly rather than globbed with "/**" so the scanned set stays
  # predictable; add one when a new Dockerfile lands. `patterns` is required
  # on a multi-ecosystem group member and names the dependency as Dependabot
  # does in its PR titles.
  - package-ecosystem: "docker"
    directories:
      - "/orville-postgresql"
      - "/orville-postgresql-typeid"
      - "/orville-docsite"
    patterns:
      - "flipstone/haskell-tools"
    multi-ecosystem-group: "haskell-tools"

  # The haskell-tools `tools` service in each sub-project's compose file. It is
  # pinned to a release tag plus digest, which is what makes it visible to
  # Dependabot at all; a per-commit sha tag is not comparable. Bumps stay
  # within the pinned GHC version, since the GHC version sits in the part of
  # the tag Dependabot treats as an opaque prefix.
  #
  # postgres is ignored deliberately. The testdb-pg13..pg18 services are a
  # version matrix: each one pins the oldest patch of a major on purpose so the
  # suite proves Orville still supports that major. Letting Dependabot bump
  # them would collapse the matrix onto whatever is newest, which is precisely
  # what these pins exist to prevent.
  - package-ecosystem: "docker-compose"
    directories:
      - "/orville-postgresql"
      - "/orville-postgresql-typeid"
    patterns:
      - "flipstone/haskell-tools"
    multi-ecosystem-group: "haskell-tools"
    ignore:
      - dependency-name: "postgres"
