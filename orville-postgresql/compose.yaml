services:
  dev:
    build: .
    volumes:
      - .:/orville-postgresql
      - stack-work:/orville-postgresql/.stack-work
      - stack-root:/stack-root
    working_dir: /orville-postgresql
    depends_on:
      - testdb-${PG_VERSION:-pg14}
    environment:
      TEST_CONN_HOST: "host=testdb-${PG_VERSION:-pg14}"
      STACK_ROOT: /stack-root
      IN_DEV_CONTAINER: "true"

  tools:
    image: ghcr.io/flipstone/haskell-tools:debian-ghc-9.10.3-build-2026.8.7.56@sha256:ba140d293971c86a850b2d20e1636c72554fc7163b4aea7c26c5d0be87c64b96
    volumes:
      - .:/orville-postgresql
    working_dir: /orville-postgresql
    environment:
      IN_TOOLS_CONTAINER: "true"

  testdb-pg14:
    image: postgres:14.0-alpine
    environment:
      POSTGRES_USER: orville_test
      POSTGRES_PASSWORD: orville

  testdb-pg15:
    image: postgres:15.0-alpine
    environment:
      POSTGRES_USER: orville_test
      POSTGRES_PASSWORD: orville

  testdb-pg16:
    image: postgres:16.0-alpine
    environment:
      POSTGRES_USER: orville_test
      POSTGRES_PASSWORD: orville

  testdb-pg17:
    image: postgres:17.0-alpine
    environment:
      POSTGRES_USER: orville_test
      POSTGRES_PASSWORD: orville

  testdb-pg18:
    image: postgres:18.0-alpine
    environment:
      POSTGRES_USER: orville_test
      POSTGRES_PASSWORD: orville


volumes:
  stack-root:
  stack-work:
